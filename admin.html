<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Админ-панель — Фонд имени Ержана Татишева</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages/inner.css">
  <link rel="stylesheet" href="css/pages/admin.css">
  <script type="module" src="js/pages/admin.js"></script>
</head>
<body class="admin">
  <header class="admin-bar">
    <a class="admin-bar__brand" href="index.html" title="Открыть сайт">
      <img src="assets/brand/logo-horizontal-blue.svg" alt="Фонд имени Ержана Татишева" height="28">
      <span>Админ-панель</span>
    </a>
    <div class="admin-bar__user" id="user-box" hidden>
      <span id="user-email"></span>
      <a class="btn btn--outline" href="index.html" target="_blank" rel="noopener">Открыть сайт</a>
      <button class="btn btn--outline" type="button" id="logout">Выйти</button>
    </div>
  </header>

  <!-- Firebase не настроен -->
  <main class="admin-center" id="screen-config" hidden>
    <div class="admin-card">
      <h1>Firebase не подключён</h1>
      <p>Вставьте конфигурацию проекта в файл <code>js/config/firebase-config.js</code> — инструкция в README.</p>
    </div>
  </main>

  <!-- Вход -->
  <main class="admin-center" id="screen-login" hidden>
    <form class="admin-card" id="login-form">
      <h1>Вход</h1>
      <p class="admin-muted">Для сотрудников фонда.</p>
      <label class="field"><span class="field__label">Email</span>
        <input class="input" type="email" name="email" autocomplete="username" required></label>
      <label class="field"><span class="field__label">Пароль</span>
        <input class="input" type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn btn--primary btn--lg" type="submit">Войти</button>
      <button class="admin-link" type="button" id="reset-password">Забыли пароль?</button>
      <p class="admin-error" id="login-error" role="alert" hidden></p>
    </form>
  </main>

  <!-- Нет прав -->
  <main class="admin-center" id="screen-denied" hidden>
    <div class="admin-card">
      <h1>Нет доступа</h1>
      <p>Этот аккаунт не добавлен в список администраторов. Обратитесь к тому, кто настраивал сайт.</p>
    </div>
  </main>

  <!-- Панель -->
  <div class="admin-app" id="screen-app" hidden>
    <nav class="admin-nav" aria-label="Разделы">
      <p class="admin-nav__group">Материалы</p>
      <button type="button" data-tab="news" aria-current="page">📰 Новости</button>
      <button type="button" data-tab="programs">📚 Программы</button>
      <button type="button" data-tab="graduates">🎓 Стипендиаты и выпускники</button>
      <button type="button" data-tab="honors">🏆 Достижения</button>
      <button type="button" data-tab="press">🗞️ О нас пишут</button>
      <p class="admin-nav__group">О фонде</p>
      <button type="button" data-tab="founder">🕯️ Ержан Татишев</button>
      <button type="button" data-tab="projects">📁 Проекты фонда</button>
      <button type="button" data-tab="timeline">🕓 Таймлайн</button>
      <button type="button" data-tab="team">👥 Органы управления и команда</button>
      <button type="button" data-tab="partners">🤝 Партнёры</button>
      <button type="button" data-tab="govdocs">📑 Документы (регламент)</button>
      <button type="button" data-tab="reports">📄 Годовые отчёты</button>
      <p class="admin-nav__group">Сайт</p>
      <button type="button" data-tab="pages">🖼️ Главная кнопка и фото страниц</button>
      <button type="button" data-tab="texts">✏️ Тексты сайта и меню</button>
      <button type="button" data-tab="settings">📞 Контакты, соцсети, пожертвования</button>
      <button type="button" data-tab="stats">🔢 Цифры на главной (круги)</button>
      <button type="button" data-tab="faq">❓ Вопросы и ответы</button>
      <button type="button" data-tab="regions">🗺️ Карта регионов</button>
    </nav>
    <main class="admin-main" id="admin-main"></main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
