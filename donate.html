<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="donate.metaTitle">Поддержать фонд — Фонд имени Ержана Татишева</title>
  <meta name="description" content="Поддержите Фонд имени Ержана Татишева: реквизиты для пожертвований.">
  <meta name="theme-color" content="#465ED5">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/inner.css">
  <script type="module" src="js/pages/donate.js"></script>

<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">Перейти к содержимому</a>
  <header class="site-header" id="site-header"></header>

  <main id="main">
    <section class="page-hero" data-photo="donate">
      <div class="container">
        <p class="eyebrow" data-i18n="donate.eyebrow">Поддержать фонд</p>
        <h1 class="page-hero__title" data-i18n-html="donate.title">Инвестируйте <em>в будущее</em></h1>

      </div>

    <section class="section">
      <div class="container contact-grid">
        <div class="form-card">
          <h2 class="form-card__title" data-i18n="donate.requisitesTitle">Реквизиты фонда</h2>
          <ul class="donate-methods" id="requisites" aria-live="polite"></ul>
        </div>
        <div class="contact-list" id="donate-contacts"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

</html>
